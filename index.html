    align-items: start;
  }

  .L { background: #fb923c; }
  .hud { display: grid; gap: 14px; }
  .statgrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat {
    border: 1px solid var(--line);
    padding: 8px 10px;
  }
  .stat b { display: block; font-size: 18px; font-weight: 600; }

  .fill { height: 100%; background: var(--accent); }

  .note { color: var(--muted); font-size: 12px; line-height: 1.55; }
  .controls {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  button {
    font: inherit;
    color: var(--bg);
    background: var(--accent);
    border: 0;
    padding: 10px 14px;
    min-height: 44px;
    cursor: pointer;

  footer { margin-top: 28px; color: var(--muted); font-size: 12px; line-height: 1.6; }

  }

const boardEl = document.getElementById("board");
const cells = [];
for (let i = 0; i < 200; i++) {
  const d = document.createElement("div");
  d.className = "cell";
  boardEl.appendChild(d);
  cells.push(d);
}
let idx = 0, timer = null, playing = true;
function paint(i) {
  const f = DATA.frames[i];
  const ghost = new Set((f.ghost || []).map(g => g.r + "," + g.c));
  for (let r = 0; r < 20; r++) {
    const row = f.board[r];
    for (let c = 0; c < 10; c++) {
      const el = cells[r * 10 + c];
      const k = row[c];
      el.className = "cell" + (k !== "." ? " on " + k : "") + (ghost.has(r + "," + c) && k !== "." ? " ghost" : "");
    }
  }
  document.getElementById("step").textContent = f.i + " / 50";
  document.getElementById("score").textContent = f.score;
  document.getElementById("lines").textContent = f.lines;
  document.getElementById("holes").textContent = f.holes;
  document.getElementById("height").textContent = f.height;
  document.getElementById("ms").textContent = f.ms ? f.ms : "—";
  document.getElementById("seek").value = String(f.i);
  const letter = document.getElementById("letter");
  const executed = f.executed || "·";
  letter.textContent = executed;
  letter.className = "letter" + (executed !== "A" && executed !== "·" ? " dev" : "");
  document.getElementById("pieceLine").textContent = f.kind
    ? ("块 " + f.kind + (f.next ? "  → next " + f.next : "") + (f.cleared ? "  消 " + f.cleared : ""))
    : "空板开局";
  document.getElementById("devNote").textContent =
    executed !== "A" && executed !== "·" ? "Jev 没选启发式第一名 A" : "";
  const bars = document.getElementById("bars");
  bars.innerHTML = "";
  const probs = f.probabilities || {};
  ["A","B","C","D"].forEach(lab => {
    if (probs[lab] == null) return;
    const pct = Math.round(probs[lab] * 100);
    const row = document.createElement("div");
    row.className = "barrow";
    row.innerHTML = "<span>"+lab+"</span><div class='track'><div class='fill"+(lab===executed?"":" alt")+"' style='width:"+pct+"%'></div></div><span>"+pct+"%</span>";
    bars.appendChild(row);
  });
}
function tick() {
  if (idx >= DATA.frames.length - 1) { stop(); return; }
  idx += 1;
  paint(idx);
}
function play() {
  playing = true;
  document.getElementById("toggle").textContent = "暂停";
  clearInterval(timer);
  timer = setInterval(tick, Number(document.getElementById("speed").value));
}
function stop() {
  playing = false;
  document.getElementById("toggle").textContent = "播放";
  clearInterval(timer);
  timer = null;
}
document.getElementById("toggle").onclick = () => playing ? stop() : (idx >= DATA.frames.length-1 ? (idx=0, paint(0), play()) : play());
document.getElementById("restart").onclick = () => { idx = 0; paint(0); play(); };
document.getElementById("speed").oninput = () => { if (playing) play(); };
document.getElementById("seek").oninput = (e) => { idx = Number(e.target.value); paint(idx); };
paint(0);
play();
</script>
</body>
</html>
