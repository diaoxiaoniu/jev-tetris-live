<style>
  :root {
    --bg: #07080b;
    --ink: #e8edf2;
    --muted: #8b93a1;
    --line: #1c2230;
    --well: #0b0e14;
    --accent: #7ee0c8;
    --warn: #ffb86b;
    --cell: 20px;
    --gap: 2px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); height: 100%; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, "IBM Plex Mono", monospace;
    height: 100dvh;
    overflow: hidden;
  }
  .wrap {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 10px 12px 12px;
    max-width: 980px;
    margin: 0 auto;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage {
    display: grid;
    grid-template-columns: auto minmax(168px, 1fr);
    gap: 14px;
    min-height: 0;
    align-items: stretch;
    margin-top: 8px;
  }
  .left { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  .well {
    background: var(--well);
    border: 1px solid var(--line);
    padding: 6px;
    width: calc(10 * (var(--cell) + var(--gap)) - var(--gap) + 12px);
    height: calc(20 * (var(--cell) + var(--gap)) - var(--gap) + 12px);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(10, var(--cell));
    grid-template-rows: repeat(20, var(--cell));
    gap: var(--gap);
  }
  .cell { background: #10141c; border-radius: 1px; }
  .cell.on { box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .I { background: #5eead4; }
  .O { background: #f5c518; }
  .T { background: #c084fc; }
  .S { background: #4ade80; }
  .Z { background: #f87171; }
  .J { background: #60a5fa; }
  .L { background: #fb923c; }
  .hud {
    display: grid;
    grid-template-rows: auto auto 1fr;
    gap: 8px;
    min-width: 0;
    min-height: 0;
  }
  .statgrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .stat { border: 1px solid var(--line); padding: 6px 8px; }
  .stat b { display: block; font-size: 15px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .piece { color: var(--muted); font-size: 12px; }
  .choices { display: grid; grid-template-rows: repeat(4, 1fr); gap: 6px; min-height: 0; }
  .choice {
    border: 1px solid var(--line);
    padding: 8px 10px;
    display: grid;
    grid-template-columns: 28px 1fr 42px;
    gap: 8px;
    align-items: center;
    min-height: 44px;
  }
  .choice .lab { font-size: 22px; font-weight: 700; }
  .choice .track { height: 8px; background: #151a24; }
  .choice .fill { height: 100%; background: #3a4458; }
  .choice .pct { text-align: right; color: var(--muted); font-size: 12px; }
  .choice.on {
    border-color: var(--accent);
    background: rgba(126,224,200,.08);
  }
  .choice.on .lab { color: var(--accent); }
  .choice.on .fill { background: var(--accent); }
  .choice.dev {
    border-color: var(--warn);
    background: rgba(255,184,107,.08);
  }
  .choice.dev .lab { color: var(--warn); }
  .choice.dev .fill { background: var(--warn); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
  }
  button {
    font: inherit;
    color: var(--bg);
    background: var(--accent);
    border: 0;
    padding: 8px 12px;
    min-height: 40px;
    cursor: pointer;
  }
  button.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  .timeline { width: 100%; }
  .foot { color: var(--muted); font-size: 11px; }
  @media (max-width: 720px) {
    :root { --cell: 14px; --gap: 1px; }
    .wrap { padding: 8px; }
    header p { display: none; }
    .stage { grid-template-columns: auto minmax(140px, 1fr); gap: 10px; }
    .choice { min-height: 40px; padding: 6px 8px; grid-template-columns: 22px 1fr 36px; }
    .choice .lab { font-size: 18px; }
    .stat b { font-size: 13px; }
    .foot { display: none; }
  }
  @media (max-width: 420px) {
    :root { --cell: 12px; }
  }
</style>

const boardEl = document.getElementById("board");
const cells = [];
for (let i = 0; i < 200; i++) {
  const d = document.createElement("div");
  d.className = "cell";
  boardEl.appendChild(d);
  cells.push(d);
}
let idx = 0, timer = null, playing = true;
function paint(i) {
  const f = DATA.frames[i];
  for (let r = 0; r < 20; r++) {
    const row = f.board[r];
    for (let c = 0; c < 10; c++) {
      const el = cells[r * 10 + c];
      const k = row[c];
      el.className = "cell" + (k !== "." ? " on " + k : "");
    }
  }
  document.getElementById("step").textContent = f.i + " / 50";
  document.getElementById("score").textContent = f.score;
  document.getElementById("lines").textContent = f.lines;
  document.getElementById("seek").value = String(f.i);
  document.getElementById("pieceLine").textContent = f.kind
    ? ("块 " + f.kind + (f.next ? " → next " + f.next : "") + (f.cleared ? " · 消 " + f.cleared : "") + (f.executed && f.executed !== "A" ? " · 没选 A" : ""))
    : "空板开局";
  const probs = f.probabilities || {};
  const executed = f.executed || "";
  ["A","B","C","D"].forEach(lab => {
    const row = document.querySelector('.choice[data-lab="'+lab+'"]');
    const pct = probs[lab] == null ? null : Math.round(probs[lab] * 100);
    document.getElementById("fill"+lab).style.width = (pct == null ? 0 : pct) + "%";
    document.getElementById("pct"+lab).textContent = pct == null ? "—" : pct + "%";
    row.classList.toggle("on", executed === lab && lab === "A");
    row.classList.toggle("dev", executed === lab && lab !== "A");
  });
}
function tick() {
  if (idx >= DATA.frames.length - 1) { stop(); return; }
  idx += 1;
  paint(idx);
}
function play() {
  playing = true;
  document.getElementById("toggle").textContent = "暂停";
  clearInterval(timer);
  timer = setInterval(tick, Number(document.getElementById("speed").value));
}
function stop() {
  playing = false;
  document.getElementById("toggle").textContent = "播放";
  clearInterval(timer);
  timer = null;
}
document.getElementById("toggle").onclick = () => playing ? stop() : (idx >= DATA.frames.length-1 ? (idx=0, paint(0), play()) : play());
document.getElementById("restart").onclick = () => { idx = 0; paint(0); play(); };
document.getElementById("speed").oninput = () => { if (playing) play(); };
document.getElementById("seek").oninput = (e) => { idx = Number(e.target.value); paint(idx); };
paint(0);
play();
</script>

</html>
